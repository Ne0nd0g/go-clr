name: CodeQL

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  schedule:
    - cron: '40 17 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go (Windows amd64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      # Set up Go before init so CodeQL traces the correct toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - name: Build library and examples
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
